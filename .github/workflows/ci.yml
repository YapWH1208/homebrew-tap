name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate AerialDrop cask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run compatibility generator tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py'

      - name: Check generated cask syntax
        run: ruby -c Casks/aerialdrop.rb
