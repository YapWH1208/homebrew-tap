name: Update cask

on:
  schedule:
    # Daily check for new AerialDrop releases (06:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - release-published

permissions:
  contents: write

jobs:
  bump:
    name: Select compatible AerialDrop releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate compatibility generator
        run: python3 -m unittest discover -s Tests -p 'test_*.py'

      - name: Update cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Scripts/update-aerialdrop.py
          ruby -c Casks/aerialdrop.rb
          if git diff --quiet -- Casks/aerialdrop.rb; then
            echo "Cask already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/aerialdrop.rb
            git commit -m "Update AerialDrop compatibility cask"
            git push
            echo "Updated AerialDrop compatibility cask."
          fi
